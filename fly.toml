# fly.toml app configuration file generated for mail-automation
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "mail-automation"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  DB_PATH = "/app/var/mail-automation.db"
  MAIL_DIR = "/app/var/mail"
  NODE_ENV = "production"

# Persistent storage for SQLite database and mail catcher directory.
# Exactly one instance/machine must be run because the sending engine runs
# in-process with SQLite in WAL mode.
[mounts]
  source = "mail_data"
  destination = "/app/var"
  initial_size = "1gb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"
